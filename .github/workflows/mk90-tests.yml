name: MK90 isolated checks

on:
  push:
    branches: [scorpion-mk90]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mk90-unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lean test dependencies
        run: python -m pip install pytest
      - name: Compile MK90 modules
        shell: pwsh
        run: python -m compileall -q app/src/scorpion/mk90_browser.py app/src/scorpion/mk90_security.py app/src/scorpion/mk90_scan_worker.py app/src/scorpion/action_policy.py app/src/scorpion/config.py app/src/scorpion/app.py
      - name: Test isolated MK90 security gates
        shell: pwsh
        env:
          PYTHONPATH: app/src
        run: python -m pytest -q app/tests/test_mk90_security.py
