name: Publish Scorpion Release

on:
  push:
    branches: [main]
    paths:
      - .release-trigger

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q src tests
      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read release tag
        id: vars
        shell: bash
        run: echo "tag=$(cat release/current.txt)" >> "$GITHUB_OUTPUT"
      - name: Rebuild release assets from repository payload
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        shell: bash
        run: |
          mkdir -p "release/$TAG/build"
          cat "release/$TAG/payload/update."*.b64 | base64 -d > "release/$TAG/build/SCORPION_update.zip"
          cat "release/$TAG/payload/full."*.b64 | base64 -d > "release/$TAG/build/SCORPION_MkIII.zip"
          base64 -d "release/$TAG/manifest.sig.b64" > "release/$TAG/build/manifest.sig"
          cp "release/$TAG/manifest.json" "release/$TAG/build/manifest.json"
      - name: Create signed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            "release/$TAG/build/manifest.json#manifest.json" \
            "release/$TAG/build/manifest.sig#manifest.sig" \
            "release/$TAG/build/SCORPION_update.zip#SCORPION_update.zip" \
            "release/$TAG/build/SCORPION_MkIII.zip#SCORPION_MkIII.zip" \
            --title "Scorpion Mk III $TAG" \
            --notes-file "release/$TAG/RELEASE_NOTES.md"
