name: Scorpion CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q src tests
      - name: Run tests
        shell: pwsh
        run: python -m pytest -q
      - name: Run MK50 self-check
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path src)
          python -m scorpion.selfcheck
      - name: Build deterministic MK50 release candidate
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path src)
          python -m scorpion.release_builder --app-root . --out ../dist/mk50 --version v50.0.0
          Write-Output "MK50_MANIFEST_BEGIN"
          Get-Content ../dist/mk50/manifest.json -Raw
          Write-Output "MK50_MANIFEST_END"
      - name: Upload MK50 release candidate
        uses: actions/upload-artifact@v4
        with:
          name: scorpion-mk50-release-candidate
          path: dist/mk50/*
          if-no-files-found: error
          retention-days: 3
      - name: Verify committed MK50 manifest
        shell: pwsh
        run: |
          if (-not (Test-Path ../release/v50.0.0/manifest.json)) {
            throw "Committed MK50 manifest is missing."
          }
          $built = Get-Content ../dist/mk50/manifest.json -Raw
          $committed = Get-Content ../release/v50.0.0/manifest.json -Raw
          if ($built -cne $committed) {
            throw "Committed MK50 manifest does not match deterministic release build."
          }
      - name: Validate release manifests exclude user data
        shell: pwsh
        run: |
          $manifests = Get-ChildItem ..\release -Filter manifest.json -Recurse -ErrorAction SilentlyContinue
          foreach ($file in $manifests) {
            $manifest = Get-Content $file.FullName -Raw | ConvertFrom-Json
            foreach ($entry in $manifest.files) {
              $path = [string]$entry.path
              if ($path -match '(^|/)(\.env|\.scorpion|data)(/|$)' -or $path -match '(?i)(memory|adaptive).*\.json$' -or $path -match '(?i)(private|signing)[_-]?key') {
                throw "Protected path found in release manifest: $path"
              }
            }
          }
